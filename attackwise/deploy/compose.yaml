# ATT&CKWISE production stack (Linux server, Docker Engine + Compose v2).
# Run through ./attackwise.sh, which passes the server config file (outside the release) as
# --env-file for the variables below and as env_file for the API container.
#   web: Nginx + Vue build, the only published port. /api/* → api over FastCGI.
#   api: Laravel on PHP-FPM, not published. Needs outbound HTTPS to raw.githubusercontent.com.
# Persistent data: the named volume attackwise_attack-cache (official ATT&CK index/bundles).
# User plans and layers never reach the server: they stay in each browser's localStorage.
name: attackwise

services:
  api:
    image: attackwise-api:${ATTACKWISE_VERSION:?set by release.env}
    env_file:
      - ${ATTACKWISE_CONFIG_FILE:?path of the server config file}
    environment:
      # Not overridable from the config file.
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      ATTACKWISE_CACHE_DIR: /var/lib/attackwise/attack-cache
    volumes:
      - attack-cache:/var/lib/attackwise/attack-cache
    read_only: true
    tmpfs:
      - /tmp:mode=1777,size=32m
      - /var/www/html/storage/framework:uid=82,gid=82,mode=0755,size=16m
      - /var/www/html/storage/logs:uid=82,gid=82,mode=0755,size=8m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep -q pong"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [attackwise]

  web:
    image: attackwise-web:${ATTACKWISE_VERSION:?set by release.env}
    depends_on:
      api:
        condition: service_started
    ports:
      # Default: loopback only, for a reverse proxy on the same host that terminates TLS.
      - "${ATTACKWISE_HTTP_BIND:-127.0.0.1}:${ATTACKWISE_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101,mode=0755,size=64m
      - /var/cache/nginx:uid=101,gid=101,mode=0755,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks: [attackwise]

networks:
  attackwise:
    name: attackwise

volumes:
  attack-cache:
    # Fixed name: shared by every release, survives container replacement and `down`.
    name: attackwise_attack-cache
