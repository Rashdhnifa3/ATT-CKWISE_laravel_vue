# Built-in TLS mode (compose.tls.yaml mounts this file over /etc/nginx/conf.d/default.conf).
# Certificates are mounted read-only at /etc/nginx/tls (fullchain.pem, privkey.pem) from
# ATTACKWISE_TLS_CERT_DIR on the server; they must be readable by uid 101 (the nginx user).
map $scheme $attackwise_https {
    default "";
    https on;
}
# Sent on HTTPS responses only. Start short; raise to 31536000 once HTTPS is confirmed.
map $scheme $attackwise_hsts {
    default "";
    https "max-age=86400";
}

# Port 80 → 8080: everything redirects to HTTPS except the container liveness probe.
server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 8443 ssl default_server;
    listen [::]:8443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:attackwise_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/attackwise/site.conf;
}
