# Locations shared by the HTTP server (default.conf) and the TLS server (deploy/nginx/tls.conf).
# Vue build: /usr/share/nginx/html. Laravel: only its front controller public/index.php in the
# "api" container is reachable, through FastCGI, and only for /api/*. No other Laravel file exists
# in this container.

root /usr/share/nginx/html;
index index.html;

# Static liveness probe for the container itself (does not touch PHP).
location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# The app shell: always revalidate so a new release is picked up on the next load.
location = / {
    include /etc/nginx/attackwise/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files /index.html =404;
}
location = /index.html {
    include /etc/nginx/attackwise/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Build metadata of this release (version, commit).
location = /version.json {
    include /etc/nginx/attackwise/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Vite output with a content hash in the file name never changes: cache for a year.
location ~* "^/assets/[^/]+-[A-Za-z0-9_-]{8}\.(?:js|css|woff2?|ttf|png|svg|jpg|jpeg|webp)$" {
    include /etc/nginx/attackwise/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

# Unhashed public files (assets/config.json, assets/d3fend/*.json, CHANGELOG.md, favicon.ico):
# revalidate every time (ETag), and never fall back to index.html.
location /assets/ {
    include /etc/nginx/attackwise/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}

# Read-only ATT&CK API → Laravel. Every method and every path under /api/ is answered by Laravel
# (unknown path → 404 JSON, other methods → 405 JSON). If PHP-FPM is down or too slow, Nginx
# still answers in the API error shape instead of an HTML page.
location /api/ {
    include /etc/nginx/fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param DOCUMENT_ROOT /var/www/html/public;
    fastcgi_param HTTPS $attackwise_https if_not_empty;
    fastcgi_param HTTP_PROXY "";
    # Resolved per request (Docker DNS), so Nginx starts and answers even while "api" is down.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $attackwise_api api:9000;
    fastcgi_pass $attackwise_api;
    fastcgi_connect_timeout 5s;
    # First request of a release downloads it from GitHub (ATTACKWISE_UPSTREAM_TIMEOUT, default 60 s).
    fastcgi_read_timeout 180s;
    # Stream large bundles (~55 MB) instead of spooling them to a temp file.
    fastcgi_buffering off;
    fastcgi_intercept_errors off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security $attackwise_hsts always;
    error_page 502 503 504 = @api_unavailable;
    error_page 413 = @api_too_large;
}
location @api_unavailable {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":{"code":"api_unavailable","message":"The ATT&CK API is temporarily unavailable."}}';
}
location @api_too_large {
    default_type application/json;
    return 413 '{"error":{"code":"payload_too_large","message":"This API is read-only."}}';
}

# Hidden files (.env, .git, …) are never served.
location ~ /\. {
    return 404;
}

# Everything else: real files of the build only. Vue uses hash fragments (#layerURL=…), so
# there are no client-side paths to rewrite; unknown paths are 404, never index.html.
location / {
    include /etc/nginx/attackwise/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
