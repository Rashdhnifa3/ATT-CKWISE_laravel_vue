# ATT&CKWISE web container: Nginx runs as the unprivileged "nginx" user on a read-only root
# filesystem; only /tmp and /var/cache/nginx are writable (tmpfs in compose.yaml).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Vite serves ES modules; make sure .mjs/.js are JavaScript and .md is text.
    types {
        text/javascript mjs;
        text/markdown md;
    }

    server_tokens off;
    charset utf-8;
    charset_types text/css text/javascript application/json text/markdown;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65s;
    client_max_body_size 16k;        # read-only API and static files: no uploads
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # Real client address when a reverse proxy on the host or on a private network sits in front.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
    access_log /dev/stdout main;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json text/markdown image/svg+xml;

    include /etc/nginx/conf.d/*.conf;
}
