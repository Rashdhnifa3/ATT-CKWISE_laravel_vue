# Included in every location that sets its own headers (add_header is not inherited once a
# location defines one). connect-src allows https: because config.json and #layerURL/#bundleURL
# may point to custom ATT&CK sources, as in the reference; everything else is same-origin.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Empty (= not sent) on plain HTTP; set by the TLS server (deploy/nginx/tls.conf).
add_header Strict-Transport-Security $attackwise_hsts always;
