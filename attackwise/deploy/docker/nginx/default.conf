# Default mode: plain HTTP on 8080. Use this behind a reverse proxy that terminates TLS
# (deploy/proxy/*.example). The proxy must send X-Forwarded-Proto; it is passed to Laravel as HTTPS.
map $http_x_forwarded_proto $attackwise_https {
    default "";
    https on;
}
# HSTS belongs to the TLS terminator (the reverse proxy) in this mode.
map $http_x_forwarded_proto $attackwise_hsts {
    default "";
}

server {
    listen 8080 default_server;
    listen [::]:8080 default_server;
    server_name _;
    include /etc/nginx/attackwise/site.conf;
}
