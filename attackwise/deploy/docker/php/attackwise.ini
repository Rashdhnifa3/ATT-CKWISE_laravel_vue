; ATT&CKWISE API (Laravel) production PHP settings.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2
; Bundle validation (json_validate) reads a ~55 MB file once per new release.
memory_limit = 256M
max_execution_time = 180
; Read-only API: no uploads, tiny request bodies.
file_uploads = Off
post_max_size = 16K
upload_max_filesize = 0
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 0
opcache.memory_consumption = 96
opcache.max_accelerated_files = 20000
realpath_cache_size = 4096K
realpath_cache_ttl = 600
