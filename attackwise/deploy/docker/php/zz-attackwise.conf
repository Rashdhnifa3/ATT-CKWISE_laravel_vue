; PHP-FPM pool for the ATT&CK API. Loaded after the image's www.conf / zz-docker.conf.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
listen = 9000
; Keep the container environment (APP_KEY, ATTACKWISE_*, APP_*_CACHE paths) visible to workers.
clear_env = no
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
request_terminate_timeout = 180s
catch_workers_output = yes
decorate_workers_output = no
; Liveness probe used by the compose healthcheck (cgi-fcgi), not reachable through Nginx.
ping.path = /fpm-ping
ping.response = pong
access.log = /dev/null
